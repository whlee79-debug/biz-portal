<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 업무 포털</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --border:rgba(11,11,11,0.10); --accent:#2a78d6; --accent2:#1baf7a;
}
@media (prefers-color-scheme: dark){
  :root{ --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --border:rgba(255,255,255,0.10); --accent:#3987e5; --accent2:#199e70; }
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--page); color:var(--ink);
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px;
}
.hero{text-align:center; margin-bottom:48px}
.hero h1{font-size:clamp(24px,4vw,34px); font-weight:700; letter-spacing:-0.02em}
.hero p{color:var(--ink2); margin-top:10px; font-size:15px}
.cards{display:flex; gap:24px; flex-wrap:wrap; justify-content:center; width:100%; max-width:820px}
.card{
  flex:1 1 300px; max-width:390px; background:var(--surface);
  border:1px solid var(--border); border-radius:16px; padding:40px 32px;
  text-decoration:none; color:var(--ink); text-align:center;
  transition:transform .15s ease, box-shadow .15s ease;
}
.card:hover{transform:translateY(-4px); box-shadow:0 12px 32px rgba(0,0,0,.10)}
.card .emoji{font-size:52px; display:block; margin-bottom:18px}
.card h2{font-size:20px; font-weight:700; margin-bottom:8px}
.card p{color:var(--ink2); font-size:14px; line-height:1.6}
.card .go{display:inline-block; margin-top:22px; font-size:14px; font-weight:600; padding:10px 22px; border-radius:8px; color:#fff}
.card.dash .go{background:var(--accent)}
.card.bot .go{background:var(--accent2)}
footer{margin-top:56px; color:var(--muted); font-size:12.5px; text-align:center}
</style>
</head>
<body>
  <div class="hero">
    <h1>통합 업무 포털</h1>
    <p>경영 현황과 HR 지원 서비스를 한 곳에서 이용하세요.</p>
  </div>
  <div class="cards">
    <a class="card dash" href="/dashboard/">
      <span class="emoji">📊</span>
      <h2>경영 대시보드</h2>
      <p>매출·비용·현금흐름, 인력·조직, 채용 파이프라인까지<br>월간 경영 현황을 한눈에 확인합니다.</p>
      <span class="go">대시보드 열기 →</span>
    </a>
    <a class="card bot" href="/chatbot/">
      <span class="emoji">💬</span>
      <h2>HR 챗봇</h2>
      <p>휴가·복리후생·근태 등 사내 인사 규정을<br>대화형으로 질문하고 답을 받아보세요.</p>
      <span class="go">챗봇 시작하기 →</span>
    </a>
  </div>
  <footer>Portfolio Demo · 본 사이트의 모든 데이터는 가상의 데모 데이터입니다.</footer>
</body>
</html>
